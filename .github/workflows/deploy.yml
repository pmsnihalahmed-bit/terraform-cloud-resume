name: Deploy Cloud Resume

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: nihal-terraform-cloud-resume-2026
  CLOUDFRONT_DISTRIBUTION_ID: "E39637LJKLKK0B"
  LAMBDA_FUNCTION_NAME: visitor-counter

jobs:
  test:
    name: Lambda Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pytest

      - name: Run Lambda tests
        working-directory: lambda
        env:
          TABLE_NAME: visitor_counter
        run: pytest

  deploy:
    name: Deploy AWS Resources
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::682975284140:role/github-actions-cloud-resume"
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda
        run: |
          cd lambda
          zip -j ../lambda.zip handler.py

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://lambda.zip

      - name: Sync website to S3
        run: |
          aws s3 sync site/ "s3://$S3_BUCKET/" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"